[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mspx"
version = "0.0.1"
authors = [
  { name="Matt Moehr", email="matthew_moehr@bradycorp.com" },
]
description = "Placeholder for mspx package to prevent slopsquating."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "LicenseRef-Proprietary"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/mattmoehr-brady/tools"
